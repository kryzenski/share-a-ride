services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_DB_PASS:-local-root-change-me}
      MYSQL_DATABASE: commutepool
      MYSQL_USER: commutepool_app
      MYSQL_PASSWORD: ${DB_PASS:-local-app-change-me}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: commutepool_app
      DB_PASS: ${DB_PASS:-local-app-change-me}
      DB_NAME: commutepool
      DB_CONNECTION_LIMIT: 20
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-this-secret}
      AUTH_MODE: ${AUTH_MODE:-demo}
      DEMO_REFRESH_SCHEDULE: "false"
      COOKIE_SECURE: "false"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost}
      OFFICE_NAME: Campus HQ Tower B
      TIMEZONE: Asia/Kolkata
    expose:
      - "3000"

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client:/usr/share/nginx/html:ro
    depends_on:
      - app

volumes:
  db_data:
