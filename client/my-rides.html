<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#38BDF8">
  <title>My rides · Share-A-Ride</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/rides.css">
</head>
<body data-page="my-rides">
  <header class="hero">
    <div class="topbar">
      <div class="menu-anchor">
        <button id="bell" class="icon-btn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M6 9a6 6 0 1 1 12 0c0 7 2 7 2 7H4s2 0 2-7" stroke-linecap="round"></path>
            <path d="M10 19a2 2 0 0 0 4 0" stroke-linecap="round"></path>
          </svg>
          <span id="bellCount" class="bell-count" hidden>0</span>
        </button>
        <div id="notifPanel" class="notif-panel" hidden></div>
      </div>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="#fff"></circle>
          <circle cx="17" cy="22" r="5" fill="#38BDF8"></circle>
          <circle cx="31" cy="22" r="5" fill="#38BDF8"></circle>
          <path d="M12 33c2.5-4 6-6 12-6s9.5 2 12 6" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"></path>
        </svg>
        <p class="brand-name">Share-A-Ride</p>
      </div>
      <div class="menu-anchor">
        <button id="userChip" class="user-chip" type="button" hidden></button>
        <div id="userMenu" class="user-menu" hidden>
          <p id="userMenuName"></p>
          <button id="logoutBtn" class="btn btn-ghost btn-block" type="button">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="sheet">
    <div class="sheet-inner">
      <section id="loginView" hidden>
        <h1 class="section-title">Sign in</h1>
        <p id="loginHint" class="lede">Only @company.com colleagues can open the ride board.</p>
        <div id="directory" class="directory"></div>
        <form id="loginForm" style="margin-top: 16px">
          <label class="field">
            <span>Work email</span>
            <input id="emailInput" name="email" type="email" autocomplete="username" placeholder="name@company.com" required>
          </label>
          <label id="passwordField" class="field" hidden>
            <span>Password</span>
            <input id="passwordInput" name="password" type="password" autocomplete="current-password">
          </label>
          <p id="loginError" class="form-error" role="alert"></p>
          <button class="btn btn-primary btn-block" type="submit">Continue</button>
        </form>
      </section>

      <section id="appView" hidden>
        <div class="sheet-head">
          <h1>My Commutes</h1>
          <a class="text-link" href="/">All Rides</a>
        </div>
        <div class="tabs" role="tablist">
          <button id="tabHosted" type="button" role="tab" aria-selected="true" class="is-active">Hosted</button>
          <button id="tabJoined" type="button" role="tab" aria-selected="false">Joined</button>
        </div>
        <div id="mineFeed" class="ride-feed" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <dialog id="rideDialog" class="sheet-dialog">
    <form id="rideForm" class="dialog-body">
      <div class="dialog-head">
        <h2 id="rideDialogTitle">Edit ride</h2>
        <button id="closeRide" class="close-btn" type="button" aria-label="Close">×</button>
      </div>
      <fieldset class="fieldset">
        <legend>Direction</legend>
        <div class="radio-row">
          <label><input type="radio" name="direction" value="TO_OFFICE" checked> To Office</label>
          <label><input type="radio" name="direction" value="FROM_OFFICE"> From Office</label>
        </div>
      </fieldset>
      <fieldset class="fieldset">
        <legend>Vehicle</legend>
        <div class="radio-row">
          <label><input type="radio" name="vehicle_type" value="CAR" checked> Personal car</label>
          <label><input type="radio" name="vehicle_type" value="BIKE"> Personal bike</label>
          <label><input type="radio" name="vehicle_type" value="UBER_AUTO"> Uber Auto</label>
          <label><input type="radio" name="vehicle_type" value="RAPIDO_AUTO"> Rapido Auto</label>
        </div>
      </fieldset>
      <div data-vehicle-fields class="grid-2">
        <label class="field">
          <span>Model</span>
          <input name="vehicle_model" maxlength="40" placeholder="Hyundai i20">
        </label>
        <label class="field">
          <span>License plate</span>
          <input name="license_plate" maxlength="20" placeholder="KA-03-HA-4411" autocapitalize="characters">
        </label>
      </div>
      <div class="grid-2">
        <label class="field">
          <span>Seats for colleagues</span>
          <select name="total_seats" required></select>
        </label>
        <label class="field">
          <span>Date</span>
          <input name="ride_date" type="date" required>
        </label>
      </div>
      <label class="field">
        <span>Departure time</span>
        <input name="ride_time" type="time" required>
      </label>
      <div id="pickupMount"></div>
      <div id="dropMount"></div>
      <label class="field">
        <span>Route notes</span>
        <textarea name="route_notes" maxlength="240" placeholder="Will wait near Tech Park Gate 2 for 5 minutes"></textarea>
      </label>
      <p id="rideError" class="form-error" role="alert"></p>
      <button id="rideSubmit" class="btn btn-primary btn-block" type="submit">Save changes</button>
    </form>
  </dialog>

  <dialog id="detailsDialog" class="sheet-dialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>Ride details</h2>
        <button id="closeDetails" class="close-btn" type="button" aria-label="Close">×</button>
      </div>
      <div id="detailsBody"></div>
    </div>
  </dialog>

  <dialog id="confirmDialog" class="sheet-dialog">
    <div class="dialog-body">
      <h2 id="confirmTitle">Cancel this seat?</h2>
      <p id="confirmBody" class="callout"></p>
      <div class="row-actions">
        <button id="confirmNo" class="btn btn-ghost" type="button">Keep it</button>
        <button id="confirmYes" class="btn btn-danger" type="button">Confirm</button>
      </div>
    </div>
  </dialog>

  <div id="toaster" class="toaster" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
